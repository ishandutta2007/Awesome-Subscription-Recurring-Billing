<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Dynamic Flow Lines Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- DYNAMIC BACKGROUND ELEMENTS -->
  <!-- Floating Ambient Orbs -->
  <circle cx="150" cy="80" r="100" fill="#0284C7" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="80;100;80" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="280" r="120" fill="#6366F1" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="280;260;280" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Data Streams -->
  <path d="M -100 60 Q 300 120 600 40 T 1300 80" fill="none" stroke="url(#line-grad)" stroke-width="3">
    <animate attributeName="d" values="M -100 60 Q 300 120 600 40 T 1300 80; M -100 80 Q 300 30 600 70 T 1300 50; M -100 60 Q 300 120 600 40 T 1300 80" dur="10s" repeatCount="indefinite" />
  </path>
  <path d="M -100 300 Q 300 240 600 310 T 1300 280" fill="none" stroke="url(#line-grad)" stroke-width="2">
    <animate attributeName="d" values="M -100 300 Q 300 240 600 310 T 1300 280; M -100 280 Q 300 310 600 260 T 1300 300; M -100 300 Q 300 240 600 310 T 1300 280" dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Pulsing Cashflow Particles -->
  <circle cx="250" cy="55" r="4" fill="#38BDF8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="65" r="5" fill="#818CF8">
    <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="295" r="4" fill="#C084FC">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- FOREGROUND CONTENT -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Top Pill Badge -->
    <rect x="420" y="42" width="360" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="600" y="63" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="1.5">⚡ CURATED FINTECH &amp; SAAS RESOURCE ⚡</text>

    <!-- Main Title -->
    <text x="600" y="150" font-size="40" font-weight="800" fill="url(#text-grad)" filter="url(#glow)" letter-spacing="-0.5">
      Awesome Subscription &amp; Recurring Billing
    </text>

    <!-- Subtitle -->
    <text x="600" y="205" font-size="20" font-weight="400" fill="#94A3B8" letter-spacing="0.5">
      Subscription Management 💳 • Usage Metering ⚡ • Invoicing &amp; RevRec 📊 • Dunning 🛡️
    </text>

    <!-- Feature Highlights / Badges -->
    <g transform="translate(600, 265)">
      <!-- Item 1: Cloud SaaS -->
      <rect x="-270" y="0" width="160" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="-190" y="23" font-size="14" font-weight="600" fill="#E2E8F0">🏢 Enterprise SaaS</text>

      <!-- Item 2: Open Source Stack -->
      <rect x="-80" y="0" width="160" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="0" y="23" font-size="14" font-weight="600" fill="#E2E8F0">💻 Open Source</text>

      <!-- Item 3: Usage Billing -->
      <rect x="110" y="0" width="160" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="190" y="23" font-size="14" font-weight="600" fill="#E2E8F0">⚡ Metered Billing</text>
    </g>
  </g>
</svg>
